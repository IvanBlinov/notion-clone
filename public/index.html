<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Workspace</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%23191919'/><text x='50' y='72' font-size='62' text-anchor='middle' fill='white' font-family='Georgia,serif' font-weight='700'>N</text></svg>" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <div class="ws-header">
          <button class="ws-btn" id="ws-switcher" title="Switch workspace, settings, invite, log out">
            <span class="ws-logo">W</span>
            <span class="ws-name">Workspace</span>
            <span class="ws-caret">⌄</span>
          </button>
          <button class="icon-btn" id="collapse-sidebar" title="Close sidebar">«</button>
        </div>
        <nav class="side-actions">
          <button class="side-item" id="btn-search"><span class="si-icon">⌕</span><span>Search</span><kbd>Ctrl K</kbd></button>
          <button class="side-item" id="btn-new-page"><span class="si-icon">＋</span><span>New page</span></button>
        </nav>
        <div class="side-scroll">
          <section class="side-section" id="fav-section" hidden>
            <div class="side-label">Favorites</div>
            <div id="fav-list"></div>
          </section>
          <section class="side-section">
            <div class="side-label">Pages <button class="icon-btn small" id="btn-add-root" title="Add a page">＋</button></div>
            <div id="tree"></div>
          </section>
        </div>
        <div class="side-bottom">
          <button class="side-item" id="btn-invite"><span class="si-icon">👥</span><span>Invite members</span></button>
          <button class="side-item" id="btn-trash"><span class="si-icon">🗑</span><span>Trash</span></button>
          <button class="side-item agent-item" id="btn-agent">
            <span class="si-icon">🤖</span><span>Connect agent</span><span class="agent-dot" id="agent-dot" title="Agent activity"></span>
          </button>
        </div>
      </aside>
      <main id="main">
        <header id="topbar">
          <button class="icon-btn" id="open-sidebar" title="Open sidebar">☰</button>
          <nav id="breadcrumb"></nav>
          <div class="top-actions">
            <span id="edited-label"></span>
            <span id="presence"></span>
            <button class="icon-btn" id="btn-comments" title="Comments" hidden>💬<span class="badge" hidden></span></button>
            <button class="icon-btn" id="btn-fav" title="Add to favorites">☆</button>
            <button class="icon-btn" id="btn-page-menu" title="Page options">⋯</button>
          </div>
        </header>
        <div id="scroller">
          <article id="page"></article>
        </div>
      </main>
    </div>
    <div id="layer"></div>
    <div id="toasts"></div>
    <script src="vendor/convex.js"></script>
    <script src="config.js"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
